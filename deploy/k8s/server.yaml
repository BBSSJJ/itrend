apiVersion: v1
kind: Service
metadata:
  name: itrend-server
  namespace: itrend
spec:
  selector:
    app.kubernetes.io/name: itrend-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itrend-server
  namespace: itrend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: itrend-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itrend-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/bbssjj/itrend-server:manual
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB_HOST
              value: itrend-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: itrend-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: itrend-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itrend-secrets
                  key: DB_PASSWORD
            - name: COLLECTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: itrend-secrets
                  key: COLLECTOR_API_KEY
            - name: SPRING_SQL_INIT_MODE
              value: always
            - name: SPRING_SQL_INIT_SCHEMA_LOCATIONS
              value: classpath:db/schema.sql
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
