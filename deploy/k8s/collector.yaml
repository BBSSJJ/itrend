apiVersion: batch/v1
kind: CronJob
metadata:
  name: itrend-collector
  namespace: itrend
spec:
  schedule: "0 * * * *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: itrend-collector
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: ghcr.io/bbssjj/itrend-collector:manual
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - npm
                - run
                - pipeline
              env:
                - name: BE_API_URL
                  value: http://itrend-server:8080
                - name: COLLECTOR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: itrend-secrets
                      key: COLLECTOR_API_KEY
                - name: GROQ_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: itrend-secrets
                      key: GROQ_API_KEY
                - name: COLLECTOR_STATE_FILE
                  value: /var/lib/itrend/state.json
                - name: TAGGER_CHUNK_SIZE
                  value: "5"
                - name: TAGGER_CHUNK_DELAY_MS
                  value: "20000"
                - name: SUMMARY_CHUNK_SIZE
                  value: "5"
                - name: SUMMARY_CHUNK_DELAY_MS
                  value: "20000"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 768Mi
              volumeMounts:
                - name: state
                  mountPath: /var/lib/itrend
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: collector-state
