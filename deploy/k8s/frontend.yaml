apiVersion: v1
kind: Service
metadata:
  name: itrend-frontend
  namespace: itrend
spec:
  selector:
    app.kubernetes.io/name: itrend-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itrend-frontend
  namespace: itrend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: itrend-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itrend-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: itrend-frontend
      containers:
        - name: frontend
          image: ghcr.io/bbssjj/itrend-frontend:manual
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

