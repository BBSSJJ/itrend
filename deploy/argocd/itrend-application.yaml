apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: itrend
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      server=docker.io/0326bsj/itrend-server,
      collector=docker.io/0326bsj/itrend-collector,
      frontend=docker.io/0326bsj/itrend-frontend
    argocd-image-updater.argoproj.io/server.update-strategy: newest-build
    argocd-image-updater.argoproj.io/collector.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/server.allow-tags: regexp:^[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/collector.allow-tags: regexp:^[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/BBSSJJ/itrend.git
    targetRevision: main
    path: deploy/quick
  destination:
    server: https://kubernetes.default.svc
    namespace: itrend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
