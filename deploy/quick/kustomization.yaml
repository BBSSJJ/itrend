apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
      - op: remove
        path: /spec/template/spec/containers/0/env
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - cloudflared
          - tunnel
          - --no-autoupdate
          - --metrics
          - 0.0.0.0:2000
          - --url
          - http://itrend-frontend.itrend.svc.cluster.local:80
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
images:
  - name: docker.io/0326bsj/itrend-collector
    newTag: 947e60642b4f812daf79c9bcf0510be2e9c238e6
  - name: docker.io/0326bsj/itrend-server
    newTag: 947e60642b4f812daf79c9bcf0510be2e9c238e6
  - name: docker.io/0326bsj/itrend-frontend
    newTag: 947e60642b4f812daf79c9bcf0510be2e9c238e6
