name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/k8s/**
      - deploy/quick/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_PREFIX: docker.io/0326bsj/itrend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-collector:${{ env.IMAGE_TAG }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-server:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}

      - name: Update Collector CronJob image tag
        run: |
          set -euo pipefail
          git pull --rebase origin main
          sed -i -E "/name: docker\\.io\\/0326bsj\\/itrend-collector/{n;s/(newTag: ).*/\\1${GITHUB_SHA}/;}" deploy/quick/kustomization.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/quick/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): Collector 이미지 태그 ${GITHUB_SHA} [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
